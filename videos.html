<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Samples</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 150px 10% 50px;
        }
        @media (max-width: 768px) { .video-grid { grid-template-columns: 1fr; } }
        
        .video-card iframe {
            width: 100%;
            height: 250px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <nav class="navbar"><div class="nav-content"><a href="index.html">← Back to Home</a></div></nav>

    <div class="video-grid">
        <div class="video-card">
            <iframe src="https://drive.google.com/file/d/1tnsroaX56nuEY1TBFSzfUgqjSSRKYI-t/view?usp=sharing" frameborder="0" allowfullscreen></iframe>
        </div>
        <div class="video-card">
            <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
